<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F8F9FA; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header {
  background: #1C2833; padding: 16pt 40pt; margin: 0;
  display: flex; align-items: center; gap: 15pt;
}
.header-badge {
  background: #3498DB; color: #FFFFFF; padding: 3pt 8pt;
  border-radius: 4pt; font-size: 10pt; font-weight: bold;
}
.header-title {
  color: #FFFFFF; font-size: 22pt; font-weight: bold; margin: 0;
}
.content {
  display: flex; flex: 1; padding: 15pt 40pt 55pt 40pt; gap: 15pt;
}
.main-area {
  flex: 1.4; display: flex; flex-direction: column; gap: 8pt;
}
.feature-row {
  display: flex; gap: 8pt;
}
.feature-box {
  flex: 1; background: #FFFFFF; padding: 10pt; border-radius: 5pt;
  box-shadow: 0 2pt 6pt rgba(0,0,0,0.06);
}
.feature-icon {
  color: #3498DB; font-size: 16pt; font-weight: bold; margin: 0 0 5pt 0;
}
.feature-title {
  color: #1C2833; font-size: 11pt; font-weight: bold; margin: 0 0 4pt 0;
}
.feature-desc {
  color: #5D6D7E; font-size: 9pt; margin: 0; line-height: 1.3;
}
.side-area {
  flex: 0.55; display: flex; flex-direction: column; gap: 8pt;
}
.stat-card {
  background: #1C2833; padding: 12pt; border-radius: 5pt; text-align: center;
}
.stat-value {
  color: #1ABC9C; font-size: 24pt; font-weight: bold; margin: 0;
}
.stat-label {
  color: #AAB7B8; font-size: 9pt; margin: 4pt 0 0 0;
}
.benefit-card {
  background: #E8F6F3; padding: 10pt; border-radius: 5pt;
  border: 1pt solid #1ABC9C;
}
.benefit-title {
  color: #16A085; font-size: 10pt; font-weight: bold; margin: 0 0 6pt 0;
}
.benefit-list {
  margin: 0; padding: 0 0 0 14pt;
}
.benefit-list li {
  color: #1C2833; font-size: 9pt; margin: 0 0 3pt 0;
}
</style>
</head>
<body>
<div class="header">
  <div class="header-badge"><p style="margin:0;color:#FFFFFF;">核心能力 3</p></div>
  <h1 class="header-title">自动化报告生成</h1>
</div>
<div class="content">
  <div class="main-area">
    <div class="feature-row">
      <div class="feature-box">
        <p class="feature-icon">A</p>
        <h4 class="feature-title">原始记录自动填写</h4>
        <p class="feature-desc">测试数据自动映射至标准模板，消除人工误差</p>
      </div>
      <div class="feature-box">
        <p class="feature-icon">B</p>
        <h4 class="feature-title">检测报告一键生成</h4>
        <p class="feature-desc">自动生成检测报告，支持多种格式输出</p>
      </div>
    </div>
    <div class="feature-row">
      <div class="feature-box">
        <p class="feature-icon">C</p>
        <h4 class="feature-title">模板灵活配置</h4>
        <p class="feature-desc">自定义报告模板，适配个性化需求</p>
      </div>
      <div class="feature-box">
        <p class="feature-icon">D</p>
        <h4 class="feature-title">版本追溯管理</h4>
        <p class="feature-desc">完整历史记录，支持版本对比追溯</p>
      </div>
    </div>
  </div>
  <div class="side-area">
    <div class="stat-card">
      <p class="stat-value">80%</p>
      <p class="stat-label">报告编制时间缩短</p>
    </div>
    <div class="stat-card">
      <p class="stat-value">0</p>
      <p class="stat-label">人工抄录错误</p>
    </div>
    <div class="benefit-card">
      <h4 class="benefit-title">释放专业人力</h4>
      <ul class="benefit-list">
        <li>减少重复性工作</li>
        <li>专注核心分析</li>
        <li>提升检测产能</li>
      </ul>
    </div>
  </div>
</div>
</body>
</html>

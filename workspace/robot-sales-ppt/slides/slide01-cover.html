<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1C2833; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
}
.accent-bar {
  position: absolute; top: 0; left: 0; right: 0; height: 8pt;
  background: #3498DB;
}
.main-title {
  color: #FFFFFF; font-size: 42pt; font-weight: bold;
  text-align: center; margin: 0 40pt 20pt 40pt;
}
.subtitle {
  color: #3498DB; font-size: 24pt;
  text-align: center; margin: 0 40pt 40pt 40pt;
}
.divider {
  width: 120pt; height: 3pt; background: #F39C12; margin: 0 0 40pt 0;
}
.tagline {
  color: #AAB7B8; font-size: 16pt;
  text-align: center; margin: 0 40pt;
}
.bottom-bar {
  position: absolute; bottom: 30pt; left: 40pt; right: 40pt;
  display: flex; justify-content: space-between;
}
.company {
  color: #AAB7B8; font-size: 12pt;
}
.date {
  color: #AAB7B8; font-size: 12pt;
}
</style>
</head>
<body>
<div class="accent-bar"></div>
<h1 class="main-title">终端服务软件</h1>
<h2 class="subtitle">机器人检测数据管理解决方案</h2>
<div class="divider"></div>
<p class="tagline">赋能大规模机器人检测 · 构建可复用数据源平台</p>
<div class="bottom-bar">
  <p class="company">上海电子所 · 机器人检测中心专案</p>
  <p class="date">2026年1月</p>
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F8F9FA; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header {
  background: #1C2833; padding: 20pt 40pt; margin: 0;
}
.header-title {
  color: #FFFFFF; font-size: 26pt; font-weight: bold; margin: 0;
}
.header-subtitle {
  color: #3498DB; font-size: 12pt; margin: 6pt 0 0 0;
}
.content {
  display: flex; flex: 1; padding: 18pt 40pt 45pt 40pt; gap: 15pt;
}
.value-card {
  flex: 1; background: #FFFFFF; border-radius: 8pt;
  box-shadow: 0 2pt 8pt rgba(0,0,0,0.08);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.card-header {
  padding: 14pt 16pt; text-align: center;
}
.card-header-1 { background: #3498DB; }
.card-header-2 { background: #1ABC9C; }
.card-header-3 { background: #F39C12; }
.card-icon {
  color: #FFFFFF; font-size: 22pt; margin: 0 0 6pt 0;
}
.card-title {
  color: #FFFFFF; font-size: 14pt; font-weight: bold; margin: 0;
}
.card-body {
  padding: 14pt; flex: 1;
}
.card-desc {
  color: #5D6D7E; font-size: 10pt; margin: 0 0 10pt 0; line-height: 1.4;
}
.card-points {
  margin: 0; padding: 0 0 0 16pt;
}
.card-points li {
  color: #1C2833; font-size: 10pt; margin: 0 0 6pt 0;
}
</style>
</head>
<body>
<div class="header">
  <h1 class="header-title">选择终端服务软件的三大理由</h1>
  <p class="header-subtitle">为机器人检测中心的长期发展提供坚实基础</p>
</div>
<div class="content">
  <div class="value-card">
    <div class="card-header card-header-1">
      <p class="card-icon">+</p>
      <h3 class="card-title">面向未来扩展</h3>
    </div>
    <div class="card-body">
      <p class="card-desc">为实验室未来扩展其他测试专业提供现成模板</p>
      <ul class="card-points">
        <li>新增测试专业快速上线</li>
        <li>数据模型可复用</li>
        <li>降低二次开发成本</li>
        <li>保护前期投资价值</li>
      </ul>
    </div>
  </div>
  <div class="value-card">
    <div class="card-header card-header-2">
      <p class="card-icon">*</p>
      <h3 class="card-title">支持科研分析</h3>
    </div>
    <div class="card-body">
      <p class="card-desc">结构化多维数据助力深度科研与创新</p>
      <ul class="card-points">
        <li>数据可直接用于机器学习</li>
        <li>支持第三方分析工具</li>
        <li>无缝对接数据平台</li>
        <li>为科研论文提供数据支撑</li>
      </ul>
    </div>
  </div>
  <div class="value-card">
    <div class="card-header card-header-3">
      <p class="card-icon">!</p>
      <h3 class="card-title">简化工作流程</h3>
    </div>
    <div class="card-body">
      <p class="card-desc">自动化流程释放专业人员生产力</p>
      <ul class="card-points">
        <li>减少80%报告编制时间</li>
        <li>消除人工抄录错误</li>
        <li>提升检测通量</li>
        <li>标准化操作流程</li>
      </ul>
    </div>
  </div>
</div>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #F8F9FA; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header {
  background: #1C2833; padding: 25pt 40pt; margin: 0;
}
.header-title {
  color: #FFFFFF; font-size: 28pt; font-weight: bold; margin: 0;
}
.header-subtitle {
  color: #3498DB; font-size: 14pt; margin: 8pt 0 0 0;
}
.content {
  display: flex; flex: 1; padding: 30pt 40pt; gap: 20pt;
}
.pain-card {
  flex: 1; background: #FFFFFF; border-radius: 8pt;
  padding: 20pt; box-shadow: 0 2pt 8pt rgba(0,0,0,0.08);
  border-top: 4pt solid #E74C3C;
  display: flex; flex-direction: column;
}
.pain-icon {
  font-size: 32pt; margin: 0 0 12pt 0; color: #E74C3C;
}
.pain-title {
  color: #1C2833; font-size: 16pt; font-weight: bold; margin: 0 0 10pt 0;
}
.pain-desc {
  color: #5D6D7E; font-size: 11pt; line-height: 1.5; margin: 0;
}
</style>
</head>
<body>
<div class="header">
  <h1 class="header-title">机器人大规模检测面临的数据挑战</h1>
  <p class="header-subtitle">传统模式下，检测数据难以发挥真正价值</p>
</div>
<div class="content">
  <div class="pain-card">
    <p class="pain-icon">1</p>
    <h3 class="pain-title">数据分散孤立</h3>
    <p class="pain-desc">自动化测试、性能测试、环境可靠性测试各自独立，数据分布在不同系统中，难以统一管理和访问</p>
  </div>
  <div class="pain-card">
    <p class="pain-icon">2</p>
    <h3 class="pain-title">格式标准不统一</h3>
    <p class="pain-desc">不同设备、不同厂商输出的数据格式各异，需要大量人工转换和整理，效率低下且容易出错</p>
  </div>
  <div class="pain-card">
    <p class="pain-icon">3</p>
    <h3 class="pain-title">关联分析困难</h3>
    <p class="pain-desc">路面压力、通信信号、运动参数等多维数据无法有效关联，难以进行深入的科研分析和问题定位</p>
  </div>
  <div class="pain-card">
    <p class="pain-icon">4</p>
    <h3 class="pain-title">报告效率低下</h3>
    <p class="pain-desc">原始记录填写繁琐，检测报告生成耗时，人工操作占用大量专业人员时间</p>
  </div>
</div>
</body>
</html>

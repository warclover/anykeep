<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1C2833; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
}
.accent-bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 8pt;
  background: #3498DB;
}
.main-title {
  color: #FFFFFF; font-size: 36pt; font-weight: bold;
  text-align: center; margin: 0 40pt 20pt 40pt;
}
.divider {
  width: 100pt; height: 3pt; background: #F39C12; margin: 0 0 30pt 0;
}
.subtitle {
  color: #AAB7B8; font-size: 16pt;
  text-align: center; margin: 0 40pt 40pt 40pt;
}
.contact-row {
  display: flex; gap: 60pt; margin: 0 0 40pt 0;
}
.contact-item {
  text-align: center;
}
.contact-label {
  color: #3498DB; font-size: 12pt; margin: 0 0 8pt 0;
}
.contact-value {
  color: #FFFFFF; font-size: 18pt; font-weight: bold; margin: 0;
}
.cta-box {
  background: #3498DB; padding: 18pt 50pt; border-radius: 6pt;
}
.cta-text {
  color: #FFFFFF; font-size: 18pt; font-weight: bold; margin: 0;
}
</style>
</head>
<body>
<h1 class="main-title">开启智能检测新时代</h1>
<div class="divider"></div>
<p class="subtitle">终端服务软件 — 您的机器人检测数据管理专家</p>
<div class="contact-row">
  <div class="contact-item">
    <p class="contact-label">联系电话</p>
    <p class="contact-value">400-XXX-XXXX</p>
  </div>
  <div class="contact-item">
    <p class="contact-label">商务邮箱</p>
    <p class="contact-value">sales@example.com</p>
  </div>
  <div class="contact-item">
    <p class="contact-label">官方网站</p>
    <p class="contact-value">www.example.com</p>
  </div>
</div>
<div class="cta-box">
  <p class="cta-text">立即预约演示 / 申请免费试用</p>
</div>
<div class="accent-bar"></div>
</body>
</html>

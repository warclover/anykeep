<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
html { background: #0D1B2A; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex;
  position: relative;
  overflow: hidden;
}

/* Main background */
.bg-layer {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #0D1B2A;
}

/* Decorative diagonal stripe */
.stripe {
  position: absolute;
  top: 0; right: 0;
  width: 280pt; height: 405pt;
  background: #152238;
  clip-path: polygon(60pt 0, 100% 0, 100% 100%, 0 100%);
}

/* Gold accent line at top */
.gold-line {
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 4pt;
  background: #C9A227;
}

/* Header section */
.header {
  position: absolute;
  top: 20pt; left: 35pt;
}

.badge {
  display: inline-block;
  padding: 4pt 12pt;
  background: #C9A227;
  border-radius: 3pt;
}

.title-section {
  position: absolute;
  top: 55pt; left: 35pt;
}

/* Left panel - Process flow */
.left-panel {
  position: absolute;
  top: 100pt; left: 35pt;
  width: 200pt;
}

.panel-header {
  padding: 10pt 15pt;
  background: #1B2838;
  border-left: 4pt solid #C9A227;
  margin-bottom: 8pt;
}

.step-container {
  padding: 0 10pt;
}

.step-item {
  display: flex;
  align-items: flex-start;
  margin-bottom: 6pt;
}

.step-num {
  width: 18pt; height: 18pt;
  background: #C9A227;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-right: 8pt;
  flex-shrink: 0;
}

.step-text {
  flex: 1;
  padding-top: 2pt;
}

.connector {
  margin-left: 8pt;
  margin-bottom: 5pt;
}

/* Right panel - Features */
.right-panel {
  position: absolute;
  top: 100pt; left: 260pt;
  width: 420pt;
}

.feature-row {
  display: flex;
  gap: 12pt;
  margin-bottom: 12pt;
}

.feature-card {
  flex: 1;
  background: #1B2838;
  border-radius: 6pt;
  padding: 15pt;
  border-top: 3pt solid #C9A227;
}

.feature-title-box {
  margin-bottom: 8pt;
}

/* Highlight box */
.highlight-box {
  position: absolute;
  bottom: 25pt; right: 35pt;
  width: 130pt; height: 100pt;
  background: #C9A227;
  border-radius: 8pt;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4pt 12pt rgba(0, 0, 0, 0.4);
}

/* Company branding */
.brand {
  position: absolute;
  top: 20pt; right: 35pt;
}
</style>
</head>
<body>
<div class="bg-layer"></div>
<div class="stripe"></div>
<div class="gold-line"></div>

<!-- Header -->
<div class="header">
  <div class="badge">
    <p style="margin: 0; color: #0D1B2A; font-size: 9pt; font-weight: bold;">CORE CAPABILITY 02</p>
  </div>
</div>

<!-- Title -->
<div class="title-section">
  <h1 style="margin: 0; color: #FFFFFF; font-size: 28pt; font-weight: bold;">向量化数据处理</h1>
  <p style="margin: 5pt 0 0 0; color: #7A8A9A; font-size: 11pt;">Vectorized Data Processing Engine</p>
</div>

<!-- Brand -->
<div class="brand">
  <p style="margin: 0; color: #C9A227; font-size: 10pt; font-weight: bold;">电脑通科技</p>
</div>

<!-- Left Panel - Process Flow -->
<div class="left-panel">
  <div class="panel-header">
    <p style="margin: 0; color: #C9A227; font-size: 11pt; font-weight: bold;">数据处理流程</p>
  </div>

  <div class="step-container">
    <div class="step-item">
      <div class="step-num">
        <p style="margin: 0; color: #0D1B2A; font-size: 10pt; font-weight: bold;">1</p>
      </div>
      <div class="step-text">
        <p style="margin: 0; color: #E0E0E0; font-size: 9pt;">原始数据接入与清洗</p>
      </div>
    </div>

    <div class="connector">
      <p style="margin: 0; color: #C9A227; font-size: 8pt;">|</p>
    </div>

    <div class="step-item">
      <div class="step-num">
        <p style="margin: 0; color: #0D1B2A; font-size: 10pt; font-weight: bold;">2</p>
      </div>
      <div class="step-text">
        <p style="margin: 0; color: #E0E0E0; font-size: 9pt;">结构化解析与标准化</p>
      </div>
    </div>

    <div class="connector">
      <p style="margin: 0; color: #C9A227; font-size: 8pt;">|</p>
    </div>

    <div class="step-item">
      <div class="step-num">
        <p style="margin: 0; color: #0D1B2A; font-size: 10pt; font-weight: bold;">3</p>
      </div>
      <div class="step-text">
        <p style="margin: 0; color: #E0E0E0; font-size: 9pt;">多维向量化存储</p>
      </div>
    </div>

    <div class="connector">
      <p style="margin: 0; color: #C9A227; font-size: 8pt;">|</p>
    </div>

    <div class="step-item">
      <div class="step-num">
        <p style="margin: 0; color: #0D1B2A; font-size: 10pt; font-weight: bold;">4</p>
      </div>
      <div class="step-text">
        <p style="margin: 0; color: #E0E0E0; font-size: 9pt;">关联索引与智能检索</p>
      </div>
    </div>
  </div>
</div>

<!-- Right Panel - Features -->
<div class="right-panel">
  <div class="feature-row">
    <div class="feature-card">
      <div class="feature-title-box">
        <p style="margin: 0; color: #C9A227; font-size: 12pt; font-weight: bold;">多维关联分析</p>
      </div>
      <p style="margin: 0; color: #B0B0B0; font-size: 9pt; line-height: 1.5;">将路面压力、运动轨迹、通信信号等不同维度数据通过时间戳和测试批次自动关联</p>
    </div>

    <div class="feature-card">
      <div class="feature-title-box">
        <p style="margin: 0; color: #C9A227; font-size: 12pt; font-weight: bold;">支持科研挖掘</p>
      </div>
      <p style="margin: 0; color: #B0B0B0; font-size: 9pt; line-height: 1.5;">结构化数据可直接导出至 Python/MATLAB，为机器学习提供高质量数据集</p>
    </div>
  </div>
</div>

<!-- Highlight Box -->
<div class="highlight-box">
  <p style="margin: 0; color: #0D1B2A; font-size: 42pt; font-weight: bold;">10x</p>
  <p style="margin: 5pt 0 0 0; color: #0D1B2A; font-size: 10pt; font-weight: bold;">数据分析效率提升</p>
</div>

</body>
</html>

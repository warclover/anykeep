<!DOCTYPE html>
<html>
<head>
<style>

  width: 720pt; height: 405pt; margin: 0; padding: 0;

}
.container {
  width: 100%; height: 100%;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
}
.accent-bar {
  position: absolute; top: 0; left: 0;

}
.title {
  color: #FFFFFF;
  font-size: 38pt;
  font-weight: bold;
  margin: 0 60pt;

}
.subtitle {
  color: #7FB3D5;
  font-size: 18pt;
  margin-top: 18pt;
  text-align: center;
}
.tagline {
  color: #AEB6BF;
  font-size: 12pt;
  margin-top: 30pt;
  text-align: center;
}
.footer {
  position: absolute;
  bottom: 35pt;
  color: #5D6D7E;
  font-size: 11pt;
}
</style>
</head>
<body>
<div class="accent-bar"></div>
<div class="container">

  <p class="tagline">为科研分析奠定数据基础 | 支撑实验室长期发展</p>
  <p class="footer">上海电子所 | 杭州机器人检测中心项目</p>
</div>
</body>
</html>

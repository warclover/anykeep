<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  background: #FFFFFF;
}
.header {
  background: #1A2B47;
  padding: 16pt 40pt;
  display: flex; align-items: center;
}
.header-accent {
  width: 5pt; height: 22pt;
  background: #E76F51;
  margin-right: 12pt;
}
.header-title {
  color: #FFFFFF;
  font-size: 20pt;
  font-weight: bold;
}
.content {
  padding: 12pt 40pt 55pt 40pt;
  display: flex;
  gap: 20pt;
}
.left-col {
  flex: 1.1;
}
.right-col {
  flex: 0.9;
  display: flex;
  flex-direction: column;
  gap: 8pt;
}
.section-box {
  border-bottom: 2pt solid #E76F51;
  padding-bottom: 3pt;
  margin-bottom: 6pt;
}
.section-title {
  color: #1A2B47;
  font-size: 11pt;
  font-weight: bold;
}
.item {
  color: #2C3E50;
  font-size: 9pt;
  margin-bottom: 5pt;
  line-height: 1.2;
}
.highlight-box {
  background: #EBF5FB;
  border-left: 3pt solid #2E86AB;
  padding: 7pt 10pt;
}
.highlight-title {
  color: #1A2B47;
  font-size: 9pt;
  font-weight: bold;
  margin-bottom: 3pt;
}
.highlight-text {
  color: #2C3E50;
  font-size: 8pt;
}
.data-box {
  background: #FDEBD0;
  border-left: 3pt solid #E76F51;
  padding: 7pt 10pt;
}
.scene-box {
  background: #E8F8F5;
  border-left: 3pt solid #1ABC9C;
  padding: 7pt 10pt;
}
</style>
</head>
<body>
<div class="header">
  <div class="header-accent"></div>
  <h1 class="header-title">项目背景与需求</h1>
</div>
<div class="content">
  <div class="left-col">
    <div class="section-box"><p class="section-title">建设背景</p></div>
    <p class="item">上海电子所将在杭州建设大型机器人检测中心</p>
    <p class="item">"人形机器人"项目对自动化测试设备提出较高要求</p>
    <p class="item">电波暗室内需部署同步数据展示系统</p>
    <div class="section-box"><p class="section-title">核心挑战</p></div>
    <p class="item">多源异构数据难以统一管理</p>
    <p class="item">测试数据缺乏结构化存储，难以二次利用</p>
    <p class="item">科研分析需要可关联的多维度数据支撑</p>
  </div>
  <div class="right-col">
    <div class="scene-box">
      <p class="highlight-title">应用场景：电波暗室</p>
      <p class="highlight-text">多源数据同步采集与实时展示</p>
    </div>
    <div class="data-box">
      <p class="highlight-title">数据类型</p>
      <p class="highlight-text">机器人运动路面压力数据</p>
      <p class="highlight-text">各项通信信号测试数据</p>
      <p class="highlight-text">自动化测试结果数据</p>
    </div>
    <div class="highlight-box">
      <p class="highlight-title">远期目标</p>
      <p class="highlight-text">为科研和研发分析提供数据基础</p>
    </div>
  </div>
</div>
</body>
</html>

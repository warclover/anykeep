<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  background: #1A2B47;
}
.content {
  padding: 40pt 55pt 50pt 55pt;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.main-title {
  color: #FFFFFF;
  font-size: 24pt;
  font-weight: bold;
  text-align: center;
  margin-bottom: 20pt;
}
.value-row {
  display: flex;
  justify-content: center;
  gap: 20pt;
  margin-bottom: 18pt;
}
.value-item {
  background: rgba(255,255,255,0.1);
  padding: 12pt 20pt;
  text-align: center;
  border-left: 3pt solid #E76F51;
}
.value-text {
  color: #FFFFFF;
  font-size: 11pt;
}
.value-sub {
  color: #7FB3D5;
  font-size: 9pt;
  margin-top: 4pt;
}
.accent-line {
  width: 45pt;
  height: 3pt;
  background: #E76F51;
  margin: 0 auto 15pt auto;
}
.slogan {
  text-align: center;
  margin-bottom: 15pt;
}
.slogan-text {
  color: #7FB3D5;
  font-size: 15pt;
  font-weight: bold;
}
.cta {
  text-align: center;
}
.cta-text {
  color: #AEB6BF;
  font-size: 10pt;
}
</style>
</head>
<body>
<div class="content">
  <h1 class="main-title">总结与价值承诺</h1>
  <div class="value-row">
    <div class="value-item">
      <p class="value-text">终端服务 = 可复用数据源</p>
      <p class="value-sub">远期战略价值</p>
    </div>
    <div class="value-item">
      <p class="value-text">一次投入，持续赋能</p>
      <p class="value-sub">支撑实验室长期发展</p>
    </div>
  </div>
  <div class="accent-line"></div>
  <div class="slogan">
    <p class="slogan-text">为机器人检测中心打造面向未来的数据基础设施</p>
  </div>
  <div class="cta">
    <p class="cta-text">期待与贵所深入合作，共同推进杭州检测中心项目落地</p>
  </div>
</div>
</body>
</html>

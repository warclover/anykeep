<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
  background: #FFFFFF;
}
.header {
  background: #1A2B47;
  padding: 16pt 40pt;
  display: flex; align-items: center;
}
.header-accent {
  width: 5pt; height: 22pt;
  background: #E76F51;
  margin-right: 12pt;
}
.header-title {
  color: #FFFFFF;
  font-size: 20pt;
  font-weight: bold;
}
.content {
  padding: 18pt 40pt 45pt 40pt;
}
.core-box {
  background: #2E86AB;
  padding: 12pt 20pt;
  text-align: center;
  margin-bottom: 18pt;
}
.core-text {
  color: #FFFFFF;
  font-size: 15pt;
  font-weight: bold;
}
.core-sub {
  color: #D6EAF8;
  font-size: 9pt;
  margin-top: 5pt;
}
.features {
  display: flex;
  gap: 15pt;
}
.feature-card {
  flex: 1;
  background: #F8F9FA;
  border-top: 3pt solid #1A2B47;
  padding: 12pt;
}
.feature-num {
  color: #E76F51;
  font-size: 18pt;
  font-weight: bold;
  margin-bottom: 5pt;
}
.feature-title {
  color: #1A2B47;
  font-size: 11pt;
  font-weight: bold;
  margin-bottom: 5pt;
}
.feature-desc {
  color: #5D6D7E;
  font-size: 9pt;
  line-height: 1.3;
}
</style>
</head>
<body>
<div class="header">
  <div class="header-accent"></div>
  <h1 class="header-title">解决方案定位</h1>
</div>
<div class="content">
  <div class="core-box">
    <p class="core-text">不仅是报告工具，更是"数据源"</p>
    <p class="core-sub">为实验室未来扩展提供现成的数据解决方案模板</p>
  </div>
  <div class="features">
    <div class="feature-card">
      <p class="feature-num">01</p>
      <h3 class="feature-title">统一数据接入</h3>
      <p class="feature-desc">多源数据统一接入，消除数据孤岛</p>
    </div>
    <div class="feature-card">
      <p class="feature-num">02</p>
      <h3 class="feature-title">结构化向量解析</h3>
      <p class="feature-desc">形成可关联的多维度向量数据</p>
    </div>
    <div class="feature-card">
      <p class="feature-num">03</p>
      <h3 class="feature-title">上层平台对接</h3>
      <p class="feature-desc">整合到数据管理平台深入挖掘</p>
    </div>
  </div>
</div>
</body>
</html>

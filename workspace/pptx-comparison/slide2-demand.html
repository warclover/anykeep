<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header {
  background: #F9FAFB; padding: 16pt 30pt; display: flex; align-items: center;
  border-bottom: 1pt solid #E5E7EB;
}
.dimension-num {
  background: #3B82F6; padding: 5pt 10pt; border-radius: 3pt; margin-right: 12pt;
}
.num-text { color: #FFFFFF; font-size: 12pt; font-weight: bold; margin: 0; }
h1 { color: #1F2937; font-size: 22pt; font-weight: bold; margin: 0; }
.content { flex: 1; display: flex; padding: 22pt 30pt; gap: 20pt; }
.column {
  flex: 1; border-radius: 8pt; padding: 18pt; display: flex; flex-direction: column;
  border: 1pt solid #E5E7EB;
}
.hardware-col { background: #F0F9FF; border-top: 4pt solid #3B82F6; }
.software-col { background: #F0FDF4; border-top: 4pt solid #10B981; }
.col-header { display: flex; align-items: center; margin-bottom: 14pt; }
.col-icon {
  width: 28pt; height: 28pt; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; margin-right: 10pt;
}
.hardware-icon { background: #3B82F6; }
.software-icon { background: #10B981; }
.icon-text { color: #FFFFFF; font-size: 12pt; font-weight: bold; margin: 0; }
.hardware-title { color: #1E40AF; font-size: 15pt; font-weight: bold; margin: 0; }
.software-title { color: #047857; font-size: 15pt; font-weight: bold; margin: 0; }
.hardware-keyword { color: #3B82F6; font-size: 18pt; font-weight: bold; margin: 10pt 0 8pt 0; }
.software-keyword { color: #10B981; font-size: 18pt; font-weight: bold; margin: 10pt 0 8pt 0; }
.description { font-size: 12pt; color: #4B5563; line-height: 1.5; margin: 0 0 10pt 0; }
.highlight {
  margin: 8pt 0 0 0; padding: 10pt 12pt; border-radius: 6pt;
}
.hardware-highlight { background: #DBEAFE; }
.software-highlight { background: #D1FAE5; }
.highlight-text-h { color: #1E40AF; font-size: 11pt; margin: 0; }
.highlight-text-s { color: #047857; font-size: 11pt; margin: 0; }
</style>
</head>
<body>
<div class="header">
  <div class="dimension-num"><p class="num-text">01</p></div>
  <h1>需求本质</h1>
</div>
<div class="content">
  <div class="column hardware-col">
    <div class="col-header">
      <div class="col-icon hardware-icon"><p class="icon-text">H</p></div>
      <p class="hardware-title">硬件设备</p>
    </div>
    <p class="hardware-keyword">工具赋能</p>
    <p class="description">满足具体检测场景的功能刚需</p>
    <div class="highlight hardware-highlight">
      <p class="highlight-text-h">核心解决："能不能测、测不准"的问题</p>
    </div>
  </div>
  <div class="column software-col">
    <div class="col-header">
      <div class="col-icon software-icon"><p class="icon-text">S</p></div>
      <p class="software-title">LIMS软件</p>
    </div>
    <p class="software-keyword">管理提效</p>
    <p class="description">满足全流程管理的效率/合规需求</p>
    <div class="highlight software-highlight">
      <p class="highlight-text-s">核心解决："流程乱、数据散、不合规"的问题</p>
    </div>
  </div>
</div>
</body>
</html>

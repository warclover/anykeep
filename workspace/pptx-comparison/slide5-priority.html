<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header {
  background: #F9FAFB; padding: 16pt 30pt; display: flex; align-items: center;
  border-bottom: 1pt solid #E5E7EB;
}
.dimension-num {
  background: #3B82F6; padding: 5pt 10pt; border-radius: 3pt; margin-right: 12pt;
}
.num-text { color: #FFFFFF; font-size: 12pt; font-weight: bold; margin: 0; }
h1 { color: #1F2937; font-size: 22pt; font-weight: bold; margin: 0; }
.content { flex: 1; display: flex; padding: 18pt 30pt; gap: 20pt; }
.column {
  flex: 1; border-radius: 8pt; padding: 14pt; display: flex; flex-direction: column;
  border: 1pt solid #E5E7EB;
}
.hardware-col { background: #F0F9FF; border-top: 4pt solid #3B82F6; }
.software-col { background: #F0FDF4; border-top: 4pt solid #10B981; }
.col-header { display: flex; align-items: center; margin-bottom: 10pt; }
.col-icon {
  width: 26pt; height: 26pt; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; margin-right: 8pt;
}
.hardware-icon { background: #3B82F6; }
.software-icon { background: #10B981; }
.icon-text { color: #FFFFFF; font-size: 11pt; font-weight: bold; margin: 0; }
.hardware-title { color: #1E40AF; font-size: 14pt; font-weight: bold; margin: 0; }
.software-title { color: #047857; font-size: 14pt; font-weight: bold; margin: 0; }
.hardware-keyword { color: #3B82F6; font-size: 15pt; font-weight: bold; margin: 6pt 0 5pt 0; }
.software-keyword { color: #10B981; font-size: 15pt; font-weight: bold; margin: 6pt 0 5pt 0; }
.priority-tag { padding: 3pt 8pt; border-radius: 3pt; margin: 0 0 6pt 0; }
.high-priority { background: #FEE2E2; }
.mid-priority { background: #FEF3C7; }
.priority-high { color: #991B1B; font-size: 9pt; margin: 0; }
.priority-mid { color: #92400E; font-size: 9pt; margin: 0; }
.description { font-size: 10pt; color: #4B5563; line-height: 1.4; margin: 0 0 6pt 0; }
.detail-box { margin: 4pt 0; padding: 6pt 8pt; border-radius: 4pt; }
.hardware-detail { background: #DBEAFE; }
.software-detail { background: #D1FAE5; }
.detail-text-h { font-size: 9pt; color: #1E40AF; margin: 0; }
.detail-text-s { font-size: 9pt; color: #047857; margin: 0; }
.intent-box { margin-top: auto; padding: 6pt 8pt; border-radius: 4pt; border-left: 3pt solid; }
.hardware-intent { background: #EFF6FF; border-left-color: #3B82F6; }
.software-intent { background: #ECFDF5; border-left-color: #10B981; }
.intent { font-size: 9pt; color: #374151; margin: 0; }
</style>
</head>
<body>
<div class="header">
  <div class="dimension-num"><p class="num-text">04</p></div>
  <h1>采购优先级</h1>
</div>
<div class="content">
  <div class="column hardware-col">
    <div class="col-header">
      <div class="col-icon hardware-icon"><p class="icon-text">H</p></div>
      <p class="hardware-title">硬件设备</p>
    </div>
    <p class="hardware-keyword">刚性替换</p>
    <div class="priority-tag high-priority"><p class="priority-high">优先级：高</p></div>
    <p class="description">多为"不得不买"的刚性需求</p>
    <div class="detail-box hardware-detail">
      <p class="detail-text-h">驱动因素：旧设备老化、新增检测项目配套</p>
    </div>
    <div class="intent-box hardware-intent">
      <p class="intent">客户主动采购意愿强</p>
    </div>
  </div>
  <div class="column software-col">
    <div class="col-header">
      <div class="col-icon software-icon"><p class="icon-text">S</p></div>
      <p class="software-title">LIMS软件</p>
    </div>
    <p class="software-keyword">柔性升级</p>
    <div class="priority-tag mid-priority"><p class="priority-mid">优先级：中等</p></div>
    <p class="description">客户常以"现有流程能凑合用"拖延</p>
    <div class="detail-box software-detail">
      <p class="detail-text-s">痛点挖掘：合规不通过、数据返工等</p>
    </div>
    <div class="intent-box software-intent">
      <p class="intent">需激发采购意愿</p>
    </div>
  </div>
</div>
</body>
</html>

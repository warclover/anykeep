<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column;
}
.header {
  background: #F9FAFB; padding: 16pt 30pt; display: flex; align-items: center;
  border-bottom: 1pt solid #E5E7EB;
}
.dimension-num {
  background: #3B82F6; padding: 5pt 10pt; border-radius: 3pt; margin-right: 12pt;
}
.num-text { color: #FFFFFF; font-size: 12pt; font-weight: bold; margin: 0; }
h1 { color: #1F2937; font-size: 22pt; font-weight: bold; margin: 0; }
.content { flex: 1; display: flex; padding: 20pt 30pt; gap: 20pt; }
.column {
  flex: 1; border-radius: 8pt; padding: 16pt; display: flex; flex-direction: column;
  border: 1pt solid #E5E7EB;
}
.hardware-col { background: #F0F9FF; border-top: 4pt solid #3B82F6; }
.software-col { background: #F0FDF4; border-top: 4pt solid #10B981; }
.col-header { display: flex; align-items: center; margin-bottom: 12pt; }
.col-icon {
  width: 28pt; height: 28pt; border-radius: 50%; display: flex;
  align-items: center; justify-content: center; margin-right: 10pt;
}
.hardware-icon { background: #3B82F6; }
.software-icon { background: #10B981; }
.icon-text { color: #FFFFFF; font-size: 12pt; font-weight: bold; margin: 0; }
.hardware-title { color: #1E40AF; font-size: 15pt; font-weight: bold; margin: 0; }
.software-title { color: #047857; font-size: 15pt; font-weight: bold; margin: 0; }
.hardware-keyword { color: #3B82F6; font-size: 16pt; font-weight: bold; margin: 8pt 0 6pt 0; }
.software-keyword { color: #10B981; font-size: 16pt; font-weight: bold; margin: 8pt 0 6pt 0; }
.description { font-size: 11pt; color: #4B5563; line-height: 1.4; margin: 0 0 8pt 0; }
.detail-box { margin: 6pt 0; padding: 8pt 10pt; border-radius: 6pt; }
.hardware-detail { background: #DBEAFE; }
.software-detail { background: #D1FAE5; }
.detail-text-h { font-size: 10pt; color: #1E40AF; margin: 0; }
.detail-text-s { font-size: 10pt; color: #047857; margin: 0; }
.cycle-box { margin-top: auto; padding: 8pt 10pt; background: #F3F4F6; border-radius: 4pt; }
.cycle { font-size: 10pt; color: #6B7280; margin: 0; }
</style>
</head>
<body>
<div class="header">
  <div class="dimension-num"><p class="num-text">02</p></div>
  <h1>决策链</h1>
</div>
<div class="content">
  <div class="column hardware-col">
    <div class="col-header">
      <div class="col-icon hardware-icon"><p class="icon-text">H</p></div>
      <p class="hardware-title">硬件设备</p>
    </div>
    <p class="hardware-keyword">单一部门主导</p>
    <p class="description">决策链短，流程简单直接</p>
    <div class="detail-box hardware-detail">
      <p class="detail-text-h">主要决策者：实验室工程师、检测员、技术主管</p>
    </div>
    <div class="cycle-box"><p class="cycle">决策周期：3-12个月</p></div>
  </div>
  <div class="column software-col">
    <div class="col-header">
      <div class="col-icon software-icon"><p class="icon-text">S</p></div>
      <p class="software-title">LIMS软件</p>
    </div>
    <p class="software-keyword">跨部门协同</p>
    <p class="description">决策链长，需多方协调配合</p>
    <div class="detail-box software-detail">
      <p class="detail-text-s">需要决策者：技术岗、IT部门、管理层、行政/质控</p>
    </div>
    <div class="cycle-box"><p class="cycle">决策周期：3-12个月</p></div>
  </div>
</div>
</body>
</html>

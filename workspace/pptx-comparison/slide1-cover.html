<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #FFFFFF; font-family: Arial, sans-serif;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
}
.top-accent {
  position: absolute; top: 0; left: 0; width: 200pt; height: 6pt;
  background: #3B82F6;
}
.bottom-accent {
  position: absolute; bottom: 0; right: 0; width: 200pt; height: 6pt;
  background: #10B981;
}
.title-container {
  text-align: center; margin-bottom: 25pt;
}
h1 {
  color: #1F2937; font-size: 38pt; font-weight: bold;
  margin: 0 0 15pt 0; letter-spacing: 1pt;
}
.subtitle {
  color: #6B7280; font-size: 18pt; margin: 0;
}
.divider {
  width: 80pt; height: 3pt; background: #E5E7EB; margin: 25pt 0;
}
.vs-container {
  display: flex; align-items: center; gap: 30pt; margin-top: 15pt;
}
.hardware-box {
  background: #3B82F6; padding: 14pt 28pt; border-radius: 6pt;
}
.software-box {
  background: #10B981; padding: 14pt 28pt; border-radius: 6pt;
}
.box-text {
  color: #FFFFFF; font-size: 16pt; font-weight: bold; margin: 0;
}
.vs-text {
  color: #9CA3AF; font-size: 22pt; font-weight: bold; margin: 0;
}
.footer-text {
  position: absolute; bottom: 25pt; color: #9CA3AF; font-size: 10pt; margin: 0;
}
</style>
</head>
<body>
<div class="top-accent"></div>
<div class="bottom-accent"></div>
<div class="title-container">
  <h1>硬件设备与LIMS软件</h1>
  <p class="subtitle">销售核心差异对比分析</p>
</div>
<div class="divider"></div>
<div class="vs-container">
  <div class="hardware-box"><p class="box-text">硬件设备</p></div>
  <p class="vs-text">VS</p>
  <div class="software-box"><p class="box-text">LIMS软件</p></div>
</div>
<p class="footer-text">6个核心维度深度对比</p>
</body>
</html>

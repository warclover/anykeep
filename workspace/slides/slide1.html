<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1C3A5F;
  font-family: Arial, sans-serif;
  display: flex;
  position: relative;
}
.gold-bar {
  position: absolute;
  left: 0;
  top: 180pt;
  width: 720pt;
  height: 8pt;
  background: #BF9A4A;
}
.content {
  margin: 40pt 50pt;
  width: 620pt;
}
.section-label {
  color: #BF9A4A;
  font-size: 14pt;
  margin-bottom: 15pt;
}
.main-content {
  margin-top: 30pt;
}
.text-item {
  color: #ffffff;
  font-size: 16pt;
  margin-bottom: 20pt;
  line-height: 1.6;
}
</style>
</head>
<body>
<div class="gold-bar"></div>
<div class="content">
  <p class="section-label">OPENING</p>
  <div class="main-content">
    <p class="text-item">来慧巢之前，过往的同事跟我有些交流，表现得非常纠结，即希望我能够改变慧巢的现状，带着团队做出成绩；又不希望我加入慧巢，重蹈他们的覆辙</p>
    <p class="text-item">我虽然前几年没有参与过慧巢的管理，但可能是听到最多关于慧巢真实情况反馈的人</p>
    <p class="text-item">过去的同事觉得我六个月内辞职，我给自己的目标是坚持一年</p>
  </div>
</div>
</body>
</html>

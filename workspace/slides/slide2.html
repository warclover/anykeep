<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #ffffff;
  font-family: Arial, sans-serif;
  display: flex;
  position: relative;
}
.left-bar {
  position: absolute;
  left: 0;
  top: 0;
  width: 12pt;
  height: 405pt;
  background: #1C3A5F;
}
.accent-bar {
  position: absolute;
  left: 12pt;
  top: 0;
  width: 4pt;
  height: 405pt;
  background: #BF9A4A;
}
.content {
  margin: 30pt 40pt 30pt 50pt;
  width: 630pt;
}
.title-box {
  border-bottom: 3pt solid #BF9A4A;
  padding-bottom: 10pt;
  margin-bottom: 25pt;
}
.title {
  color: #1C3A5F;
  font-size: 28pt;
  font-weight: bold;
}
.principles {
  margin-bottom: 25pt;
}
.principle-box {
  border-left: 4pt solid #BF9A4A;
  padding-left: 20pt;
  margin-bottom: 12pt;
}
.principle-text {
  color: #1C3A5F;
  font-size: 18pt;
}
.divider {
  width: 100pt;
  height: 2pt;
  background: #E0E0E0;
  margin: 20pt 0;
}
.note-item {
  color: #555555;
  font-size: 16pt;
  margin-bottom: 10pt;
}
</style>
</head>
<body>
<div class="left-bar"></div>
<div class="accent-bar"></div>
<div class="content">
  <div class="title-box">
    <p class="title">加入慧巢后，我给自己定的几个原则</p>
  </div>
  <div class="principles">
    <div class="principle-box">
      <p class="principle-text">讲真话：实事求是，尊重客观</p>
    </div>
    <div class="principle-box">
      <p class="principle-text">办实事：带头干活，填坑开路</p>
    </div>
    <div class="principle-box">
      <p class="principle-text">归零思维：回归沟通，回归简单，回归高效</p>
    </div>
  </div>
  <div class="divider"></div>
  <ul>
    <li class="note-item">整个人被危机感、迫切感、焦虑包裹着</li>
    <li class="note-item">做的改变非常少、无奈的地方特别多、没有办法专注聚焦</li>
  </ul>
</div>
</body>
</html>

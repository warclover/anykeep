<!DOCTYPE html>
<html>
<head>
<style>
html { background: #ffffff; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  background: #1C3A5F;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
}
.top-accent {
  position: absolute;
  top: 0;
  left: 200pt;
  width: 320pt;
  height: 6pt;
  background: #BF9A4A;
}
.bottom-accent {
  position: absolute;
  bottom: 0;
  left: 200pt;
  width: 320pt;
  height: 6pt;
  background: #BF9A4A;
}
.label {
  color: #BF9A4A;
  font-size: 20pt;
  margin-bottom: 20pt;
  letter-spacing: 4pt;
}
.main-text {
  color: #ffffff;
  font-size: 36pt;
  font-weight: bold;
  text-align: center;
  max-width: 600pt;
  line-height: 1.4;
}
</style>
</head>
<body>
<div class="top-accent"></div>
<div class="bottom-accent"></div>
<p class="label">THE MOST IMPORTANT PRINCIPLE</p>
<p class="main-text">要让慧巢成为不被自己员工反感的公司</p>
</body>
</html>

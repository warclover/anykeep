# V4.0 智能分类回归测试 CI/CD
#
# 触发条件:
# 1. PR 提交到 main/master 分支
# 2. 涉及分类相关代码变更
#
# 验收标准:
# - 准确率下降 > 2% 阻止合并
# - 生成测试报告作为 PR 评论

name: Classification Regression Test

on:
  pull_request:
    branches:
      - main
      - master
      - develop
    paths:
      - "src/lib/classification/**"
      - "src/app/api/classification/**"
      - "tests/classification/**"
  push:
    branches:
      - main
      - master
    paths:
      - "src/lib/classification/**"
      - "tests/classification/**"
  workflow_dispatch: # 支持手动触发

concurrency:
  group: classification-regression-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  ACCURACY_THRESHOLD: "80"
  ACCURACY_DROP_THRESHOLD: "2"

jobs:
  regression-test:
    name: Run Classification Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run regression tests
        id: regression
        run: |
          # 运行测试并捕获输出
          set +e
          npm run test -- --testPathPattern=regression.test.ts --json --outputFile=test-results.json 2>&1 | tee test-output.txt
          TEST_EXIT_CODE=$?
          set -e

          # 解析测试结果
          if [ -f test-results.json ]; then
            PASSED=$(jq '.numPassedTests' test-results.json)
            FAILED=$(jq '.numFailedTests' test-results.json)
            TOTAL=$((PASSED + FAILED))

            if [ $TOTAL -gt 0 ]; then
              ACCURACY=$(echo "scale=2; $PASSED * 100 / $TOTAL" | bc)
            else
              ACCURACY=0
            fi

            echo "passed=$PASSED" >> $GITHUB_OUTPUT
            echo "failed=$FAILED" >> $GITHUB_OUTPUT
            echo "total=$TOTAL" >> $GITHUB_OUTPUT
            echo "accuracy=$ACCURACY" >> $GITHUB_OUTPUT
            echo "exit_code=$TEST_EXIT_CODE" >> $GITHUB_OUTPUT
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
            echo "accuracy=0" >> $GITHUB_OUTPUT
            echo "exit_code=1" >> $GITHUB_OUTPUT
          fi

      - name: Check accuracy threshold
        id: check
        run: |
          ACCURACY="${{ steps.regression.outputs.accuracy }}"
          THRESHOLD="${{ env.ACCURACY_THRESHOLD }}"

          if (( $(echo "$ACCURACY < $THRESHOLD" | bc -l) )); then
            echo "status=failed" >> $GITHUB_OUTPUT
            echo "message=❌ 准确率 ${ACCURACY}% 低于阈值 ${THRESHOLD}%" >> $GITHUB_OUTPUT
          else
            echo "status=passed" >> $GITHUB_OUTPUT
            echo "message=✅ 准确率 ${ACCURACY}% 达标 (阈值: ${THRESHOLD}%)" >> $GITHUB_OUTPUT
          fi

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-test-report
          path: |
            test-results.json
            test-output.txt
            tests/classification/regression-report.json
          retention-days: 30

      - name: Comment PR with results
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const passed = '${{ steps.regression.outputs.passed }}';
            const failed = '${{ steps.regression.outputs.failed }}';
            const total = '${{ steps.regression.outputs.total }}';
            const accuracy = '${{ steps.regression.outputs.accuracy }}';
            const status = '${{ steps.check.outputs.status }}';
            const message = '${{ steps.check.outputs.message }}';

            const emoji = status === 'passed' ? '✅' : '❌';
            const statusBadge = status === 'passed'
              ? '![Pass](https://img.shields.io/badge/status-pass-success)'
              : '![Fail](https://img.shields.io/badge/status-fail-critical)';

            const body = `## ${emoji} 智能分类回归测试报告

            ${statusBadge}

            ### 测试结果

            | 指标 | 值 |
            |------|-----|
            | 总样本 | ${total} |
            | 通过 | ${passed} |
            | 失败 | ${failed} |
            | 准确率 | ${accuracy}% |
            | 阈值 | ${{ env.ACCURACY_THRESHOLD }}% |

            ### 结论

            ${message}

            ---
            <details>
            <summary>查看详细报告</summary>

            请下载 Artifacts 中的 \`regression-test-report\` 查看完整报告。

            </details>

            *Generated by Classification Regression CI*`;

            // 查找已有评论
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('智能分类回归测试报告')
            );

            if (botComment) {
              // 更新已有评论
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // 创建新评论
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      - name: Fail if accuracy below threshold
        if: steps.check.outputs.status == 'failed'
        run: |
          echo "❌ 分类准确率低于阈值，PR 不能合并"
          echo "${{ steps.check.outputs.message }}"
          exit 1

  # 可选：权重变更审计
  audit-weight-changes:
    name: Audit Weight Changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Checkout head
        uses: actions/checkout@v4
        with:
          path: head

      - name: Check for weight changes
        id: weight-changes
        run: |
          # 检查权重相关文件变更
          WEIGHT_FILES=(
            "src/lib/classification/v3/services/dynamic-weights.service.ts"
            "src/lib/classification/v3/config.ts"
            "supabase/migrations/*scenario*weight*.sql"
          )

          CHANGES_FOUND=false
          CHANGED_FILES=""

          for pattern in "${WEIGHT_FILES[@]}"; do
            if [ -f "head/$pattern" ] && [ -f "base/$pattern" ]; then
              if ! diff -q "base/$pattern" "head/$pattern" > /dev/null 2>&1; then
                CHANGES_FOUND=true
                CHANGED_FILES="$CHANGED_FILES\n- $pattern"
              fi
            elif [ -f "head/$pattern" ]; then
              CHANGES_FOUND=true
              CHANGED_FILES="$CHANGED_FILES\n- $pattern (新增)"
            fi
          done

          echo "found=$CHANGES_FOUND" >> $GITHUB_OUTPUT
          echo "files=$CHANGED_FILES" >> $GITHUB_OUTPUT

      - name: Comment weight changes warning
        if: steps.weight-changes.outputs.found == 'true' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const files = '${{ steps.weight-changes.outputs.files }}';

            const body = `## ⚠️ 权重配置变更检测

            此 PR 包含分类权重相关配置的变更：

            ${files}

            **请确认**:
            - [ ] 已在测试环境验证权重变更效果
            - [ ] 回归测试准确率未显著下降
            - [ ] 已记录变更原因和预期影响

            *权重变更可能影响所有用户的分类体验，请谨慎审核。*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });

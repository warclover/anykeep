<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AnyKeep</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      min-height: 200px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                   'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
      font-size: 14px;
      color: #333;
      background: #fff;
    }

    /* 头部 */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px;
      border-bottom: 1px solid #eee;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .header-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.2);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-logo svg {
      width: 20px;
      height: 20px;
    }

    .header-title {
      font-size: 18px;
      font-weight: 600;
    }

    /* 主内容区 */
    .content {
      padding: 16px;
    }

    /* 登录提示 */
    .login-prompt {
      text-align: center;
      padding: 20px 0;
    }

    .login-prompt p {
      margin-bottom: 16px;
      color: #666;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-primary {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
    }

    .btn-primary:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #f3f4f6;
      color: #374151;
    }

    .btn-secondary:hover {
      background: #e5e7eb;
    }

    .btn-block {
      display: flex;
      width: 100%;
    }

    /* 用户信息 */
    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: #f9fafb;
      border-radius: 8px;
      margin-bottom: 16px;
    }

    .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #666;
    }

    .user-name {
      font-weight: 500;
    }

    .user-email {
      font-size: 12px;
      color: #666;
    }

    /* 文章预览卡片 */
    .article-card {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .article-cover {
      width: 100%;
      height: 120px;
      object-fit: cover;
      background: #f3f4f6;
    }

    .article-info {
      padding: 12px;
    }

    .article-title {
      font-size: 15px;
      font-weight: 500;
      line-height: 1.4;
      margin-bottom: 8px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .article-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #666;
    }

    .article-meta-item {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    /* 状态提示 */
    .status-message {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .status-message.success {
      background: #d1fae5;
      color: #065f46;
    }

    .status-message.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .status-message.info {
      background: #dbeafe;
      color: #1e40af;
    }

    /* 队列状态 */
    .queue-status {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: #fffbeb;
      border-radius: 8px;
      font-size: 13px;
      color: #92400e;
      margin-bottom: 16px;
    }

    .queue-count {
      font-weight: 500;
    }

    .queue-sync-btn {
      padding: 4px 12px;
      background: #fbbf24;
      color: #78350f;
      border: none;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }

    /* 非微信页面提示 */
    .not-wechat {
      text-align: center;
      padding: 30px 20px;
      color: #666;
    }

    .not-wechat-icon {
      width: 48px;
      height: 48px;
      margin: 0 auto 16px;
      color: #d1d5db;
    }

    /* 加载状态 */
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    .loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #e5e7eb;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .loading-text {
      margin-top: 12px;
      color: #666;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Footer */
    .footer {
      padding: 12px 16px;
      border-top: 1px solid #eee;
      text-align: center;
    }

    .footer a {
      font-size: 12px;
      color: #666;
      text-decoration: none;
    }

    .footer a:hover {
      color: #667eea;
    }

    /* Hide by default */
    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <!-- 头部 -->
  <header class="header">
    <div class="header-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
      </svg>
    </div>
    <h1 class="header-title">AnyKeep</h1>
  </header>

  <!-- 主内容 -->
  <main class="content">
    <!-- 加载状态 -->
    <div id="loading-state" class="loading">
      <div class="loading-spinner"></div>
      <p class="loading-text">加载中...</p>
    </div>

    <!-- 未登录状态 -->
    <div id="login-state" class="login-prompt hidden">
      <p>登录后即可保存文章到您的收藏夹</p>
      <button id="login-btn" class="btn btn-primary btn-block">登录 AnyKeep</button>
    </div>

    <!-- 已登录状态 -->
    <div id="main-state" class="hidden">
      <!-- 用户信息 -->
      <div class="user-info">
        <div class="user-avatar" id="user-avatar">👤</div>
        <div>
          <div class="user-name" id="user-name">用户</div>
          <div class="user-email" id="user-email">user@example.com</div>
        </div>
      </div>

      <!-- 离线队列状态 -->
      <div id="queue-status" class="queue-status hidden">
        <span><span class="queue-count" id="queue-count">0</span> 篇文章待同步</span>
        <button id="sync-btn" class="queue-sync-btn">立即同步</button>
      </div>

      <!-- 状态消息 -->
      <div id="status-message" class="status-message hidden"></div>

      <!-- 非微信页面 -->
      <div id="not-wechat" class="not-wechat hidden">
        <svg class="not-wechat-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
        <p>请在微信公众号文章页面使用</p>
        <p style="font-size: 12px; margin-top: 8px; color: #999;">
          支持 mp.weixin.qq.com 域名下的文章
        </p>
      </div>

      <!-- 文章预览 -->
      <div id="article-preview" class="hidden">
        <div class="article-card">
          <img id="article-cover" class="article-cover" src="" alt="">
          <div class="article-info">
            <h3 class="article-title" id="article-title">文章标题</h3>
            <div class="article-meta">
              <span class="article-meta-item" id="article-author">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                  <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>作者</span>
              </span>
              <span class="article-meta-item" id="article-words">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                </svg>
                <span>0 字</span>
              </span>
            </div>
          </div>
        </div>

        <button id="save-btn" class="btn btn-primary btn-block">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
          </svg>
          保存到 AnyKeep
        </button>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <a href="http://localhost:3000" target="_blank">打开 AnyKeep 网页版</a>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
